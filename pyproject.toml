[project]
name = "oag-vs-kg"
version = "0.1.0"
description = "OAG vs ticket knowledge graph: research, deck and live demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
# Deck and diagrams: presentacion/build_pptx_oag.py, docs/img/build_diagrams.py --png
deck = [
    "python-pptx>=1.0",
    "pillow>=10",
    "cairosvg>=2.7",
]
# Optional semantic retrieval for demo/naive_rag.py --embed (pulls torch, large)
embed = [
    "sentence-transformers>=3",
]

[tool.uv]
package = false
default-groups = ["deck"]
