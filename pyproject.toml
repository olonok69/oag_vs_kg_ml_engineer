[project]
name = "oag-vs-kg"
version = "0.1.0"
description = "OAG vs ticket knowledge graph: research, deck and live demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
# Deck and diagrams: presentacion/build_pptx_oag.py, docs/img/build_diagrams.py --png
deck = [
    "python-pptx>=1.0",
    "pillow>=10",
    "cairosvg>=2.7",
]
# Optional semantic layer (demo/semantic.py: naive_rag.py --embed, graphrag.py --semantic,
# oag.py query --semantic). CPU-only torch from the PyTorch index, so Linux/WSL does not pull CUDA.
# The model (~470 MB) is downloaded from huggingface.co on first use.
embed = [
    "sentence-transformers>=3",
    "torch>=2.2",
]

[tool.uv]
package = false
default-groups = ["deck"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
