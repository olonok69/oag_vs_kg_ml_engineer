<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="720" fill="#0F141A"/><rect x="0" y="0" width="8" height="720" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">USAGE GUIDE</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">When each technique fits</text><rect x="40" y="120" width="210" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="147.0" font-size="14" fill="#9AA4B2" font-weight="bold" text-anchor="start">Technique</text><rect x="270" y="120" width="310" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="147.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Fits when</text><rect x="600" y="120" width="310" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="147.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Cost and risk</text><rect x="930" y="120" width="420" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="147.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Example in our work</text><rect x="40" y="172" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="198.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">No RAG</text><rect x="270" y="172" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="198.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">The whole context fits in the model</text><text x="284" y="214.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">window.</text><rect x="600" y="172" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="198.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Nothing extra; token cost.</text><rect x="930" y="172" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="198.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">One ticket and its writeup in a session.</text><rect x="40" y="254" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="280.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">Naive RAG</text><rect x="270" y="254" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="280.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Point questions over lots of unstructured</text><text x="284" y="296.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">text.</text><rect x="600" y="254" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="280.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Cheap; returns loose chunks and noise.</text><rect x="930" y="254" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="280.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Find where a specific error is mentioned.</text><rect x="40" y="336" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="362.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">RAG + rerank / hybrid</text><rect x="270" y="336" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="362.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Varied vocabulary or exact names (IDs,</text><text x="284" y="378.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">symbols).</text><rect x="600" y="336" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="362.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">One more model; better precision.</text><rect x="930" y="336" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="362.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Ticket IDs and function names.</text><rect x="40" y="418" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="444.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">Agentic RAG</text><rect x="270" y="418" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="444.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Exploratory or multi-step questions.</text><rect x="600" y="418" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="444.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">More tokens and steps; varies between</text><text x="614" y="460.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">runs.</text><rect x="930" y="418" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="444.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Investigate the root cause of a new bug.</text><rect x="40" y="500" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="526.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">GraphRAG</text><rect x="270" y="500" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="526.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Relations and global themes; «what is</text><text x="284" y="542.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">around X».</text><rect x="600" y="500" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="526.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Costly build; unstable schema.</text><rect x="930" y="500" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="526.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">/kg: danger zone before touching code.</text><rect x="40" y="582" width="210" height="72" rx="12" fill="#222B38" stroke="#D97757" stroke-width="1.2"/><text x="54" y="608.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">OAG</text><rect x="270" y="582" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="608.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Typed facts, rules, auditing and</text><text x="284" y="624.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">attribution.</text><rect x="600" y="582" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="608.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Writing and maintaining the ontology.</text><rect x="930" y="582" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="608.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Invariants to respect before a merge.</text><text x="40" y="698.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">Rule of thumb: start with the simplest technique that answers the real questions, and measure before moving up.</text></svg>