<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="470" fill="#0F141A"/><rect x="0" y="0" width="8" height="470" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">OG-RAG (MICROSOFT RESEARCH)</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">The OG-RAG pipeline</text><rect x="40.0" y="115" width="244.8" height="160" rx="12" fill="#222B38" stroke="#D97757" stroke-width="2"/><text x="56.0" y="143.0" font-size="12" fill="#D97757" font-weight="bold" text-anchor="start">01</text><text x="56.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Ontology</text><text x="56.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Triples (subject, attribute,</text><text x="56.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">value) written or reviewed by</text><text x="56.0" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">experts.</text><line x1="286.8" y1="195" x2="306.8" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="308.8" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="324.8" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">02</text><text x="324.8" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Preprocessing</text><text x="324.8" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">An LLM maps each document to</text><text x="324.8" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">the ontology and emits JSON-LD</text><text x="324.8" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">fact blocks.</text><line x1="555.6" y1="195" x2="575.6" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="577.6" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="593.6" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">03</text><text x="593.6" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Hypergraph</text><text x="593.6" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Each fact block is a</text><text x="593.6" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">hyperedge; each key-value</text><text x="593.6" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">pair, a hypernode.</text><line x1="824.4000000000001" y1="195" x2="844.4000000000001" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="846.4000000000001" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="862.4000000000001" y="143.0" font-size="12" fill="#D97757" font-weight="bold" text-anchor="start">04</text><text x="862.4000000000001" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Retrieval</text><text x="862.4000000000001" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Top-k nodes by key and by</text><text x="862.4000000000001" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">value; greedy: the smallest</text><text x="862.4000000000001" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">set of hyperedges covering</text><text x="862.4000000000001" y="242.5" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">them.</text><line x1="1093.2" y1="195" x2="1113.2" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="1115.2" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="1131.2" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">05</text><text x="1131.2" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Generation</text><text x="1131.2" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">The facts go into the prompt.</text><text x="1131.2" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">No extra LLM calls at query</text><text x="1131.2" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">time.</text><rect x="40" y="300" width="1320" height="120" rx="12" fill="#0A0E13" stroke="#2E3948" stroke-width="1.2"/><text x="64" y="330.0" font-size="13" fill="#7AA2C7" font-weight="bold" text-anchor="start">A fact block (simplified, from the paper)</text><text x="64" y="360.0" font-size="15" fill="#E8EAED" font-weight="normal" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, monospace">{&quot;@type&quot;: &quot;Crop&quot;, &quot;name&quot;: &quot;Soybean&quot;,</text><text x="64" y="385.0" font-size="15" fill="#E8EAED" font-weight="normal" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, monospace"> &quot;isGrownIn&quot;: {&quot;@type&quot;: &quot;CropRegion&quot;, &quot;name&quot;: &quot;Madhya Pradesh&quot;},</text><text x="64" y="410.0" font-size="15" fill="#E8EAED" font-weight="normal" text-anchor="start" font-family="Consolas, DejaVu Sans Mono, monospace"> &quot;sowingTime&quot;: &quot;mid-June to early July&quot;}</text><text x="1330" y="410.0" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="end">one fact block = one hyperedge</text><text x="40" y="448.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">Sharma, Kumar and Li, OG-RAG, arXiv 2412.15235 (2024), EMNLP 2025.</text></svg>