<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="560" fill="#0F141A"/><rect x="0" y="0" width="8" height="560" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">NUESTRO SISTEMA</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">La pipeline del grafo de tickets (/kg-refresh y /kg)</text><text x="40" y="120.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Construcción: /kg-refresh (se paga una vez)</text><rect x="40.0" y="135" width="246.4" height="130" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="56.0" y="163.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Manifest</text><text x="56.0" y="189.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">build_manifest.py elige ~341</text><text x="56.0" y="205.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">ficheros: writeups, hubs,</text><text x="56.0" y="221.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">procesos, memoria.</text><line x1="288.4" y1="200" x2="306.4" y2="200" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="308.4" y="135" width="246.4" height="130" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="324.4" y="163.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Corpus</text><text x="324.4" y="189.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">stage_corpus.py aplana con</text><text x="324.4" y="205.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">nombres que guardan la</text><text x="324.4" y="221.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">procedencia (sst-NNNN__…).</text><line x1="556.8" y1="200" x2="574.8" y2="200" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="576.8" y="135" width="246.4" height="130" rx="12" fill="#222B38" stroke="#D97757" stroke-width="2"/><text x="592.8" y="163.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">/graphify</text><text x="592.8" y="189.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">~22 subagentes LLM extraen nodos</text><text x="592.8" y="205.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">y aristas. El prompt fija la</text><text x="592.8" y="221.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">convención de IDs.</text><line x1="825.1999999999999" y1="200" x2="843.1999999999999" y2="200" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="845.1999999999999" y="135" width="246.4" height="130" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="861.1999999999999" y="163.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Canonicalizar</text><text x="861.1999999999999" y="189.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">Fusión de IDs duplicados, censo</text><text x="861.1999999999999" y="205.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">de convención, leak-check.</text><line x1="1093.6" y1="200" x2="1111.6" y2="200" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="1113.6" y="135" width="246.4" height="130" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="1129.6" y="163.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Nombres</text><text x="1129.6" y="189.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">community_labels.json: nombres de</text><text x="1129.6" y="205.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">comunidad, remap y auditoría</text><text x="1129.6" y="221.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">manual.</text><text x="40" y="305.0" font-size="14" fill="#8CC28C" font-weight="bold" text-anchor="start">Consulta: /kg (determinista, sin LLM)</text><rect x="40.0" y="320" width="313.5" height="115" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="56.0" y="348.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Tema</text><text x="56.0" y="374.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">/kg get_letter_end, /kg SST-A SST-B, /kg</text><text x="56.0" y="390.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">find &lt;texto&gt;</text><line x1="355.5" y1="377" x2="373.5" y2="377" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="375.5" y="320" width="313.5" height="115" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="391.5" y="348.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">graph.json</text><text x="391.5" y="374.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">explain (vecinos), path (camino), find</text><text x="391.5" y="390.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">(subcadena).</text><line x1="691.0" y1="377" x2="709.0" y2="377" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="711.0" y="320" width="313.5" height="115" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="727.0" y="348.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Danger zone</text><text x="727.0" y="374.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">Comunidad con nombre + conexiones: tickets,</text><text x="727.0" y="390.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">sharp edges, rationales.</text><line x1="1026.5" y1="377" x2="1044.5" y2="377" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="1046.5" y="320" width="313.5" height="115" rx="12" fill="#222B38" stroke="#8CC28C" stroke-width="2"/><text x="1062.5" y="348.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Leer el writeup</text><text x="1062.5" y="374.8" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">El grafo apunta; el writeup manda (regla</text><text x="1062.5" y="390.4" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">history-first).</text><line x1="1290" y1="267" x2="1290" y2="318" stroke="#9AA4B2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="40" y="478.0" font-size="13" fill="#D9B25F" font-weight="normal" text-anchor="start">Lo aprendido: sin esquema, cada refresh reinventa IDs y tipos. Supervivencia de IDs entre reconstrucciones: 12,6 % antes de fijar la convención en el prompt, 35-43 % después. Unas tres</text><text x="40" y="494.9" font-size="13" fill="#D9B25F" font-weight="normal" text-anchor="start">cuartas partes de las aristas son genéricas (references).</text><text x="40" y="538.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">Fuente: KG_PROCEDURES.md y EXTRACTION_PROMPT del repo lambda; reference/KNOWLEDGE_GRAPH.md.</text></svg>