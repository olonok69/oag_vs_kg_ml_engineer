<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="420" fill="#0F141A"/><rect x="0" y="0" width="8" height="420" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">DEMO</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">OAG in the demo: ontology first, facts second</text><rect x="40.0" y="115" width="244.8" height="160" rx="12" fill="#222B38" stroke="#7AA2C7" stroke-width="2"/><text x="56.0" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">01</text><text x="56.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">ontology.yaml</text><text x="56.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">4 classes, 6 relations,</text><text x="56.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">components with synonyms</text><text x="56.0" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">(English and Spanish) and</text><text x="56.0" y="242.5" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">extraction rules.</text><line x1="286.8" y1="195" x2="306.8" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="308.8" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="324.8" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">02</text><text x="324.8" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Extraction</text><text x="324.8" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Deterministic parser: titles,</text><text x="324.8" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">invariant tables, citations,</text><text x="324.8" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">tests and synonyms.</text><line x1="555.6" y1="195" x2="575.6" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="577.6" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="593.6" y="143.0" font-size="12" fill="#D9B25F" font-weight="bold" text-anchor="start">03</text><text x="593.6" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Validation</text><text x="593.6" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Whatever the schema does not</text><text x="593.6" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">allow is rejected (e.g.</text><text x="593.6" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">generic mentions) and</text><text x="593.6" y="242.5" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">reported.</text><line x1="824.4000000000001" y1="195" x2="844.4000000000001" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="846.4000000000001" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="862.4000000000001" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">04</text><text x="862.4000000000001" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">facts.json</text><text x="862.4000000000001" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Typed nodes and edges, each</text><text x="862.4000000000001" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">with its source file.</text><line x1="1093.2" y1="195" x2="1113.2" y2="195" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="1115.2" y="115" width="244.8" height="160" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="1131.2" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">05</text><text x="1131.2" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Query</text><text x="1131.2" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Question → component</text><text x="1131.2" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">(altLabels) → greedy set cover</text><text x="1131.2" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">→ fact blocks.</text><rect x="40" y="300" width="1320" height="64" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="64" y="338.0" font-size="14" fill="#E8EAED" font-weight="normal" text-anchor="start">No LLM at build or query time. In production, extraction would be completed by an LLM guided by the same ontology (Phase C), always validated.</text><text x="40" y="398.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">demo/oag.py and demo/oag/ontology.yaml.</text></svg>