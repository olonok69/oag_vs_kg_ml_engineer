<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" width="1400" height="450" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="450" fill="#0F141A"/><rect x="0" y="0" width="8" height="450" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">FROM RAG TO OAG</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">Six generations of retrieval augmentation</text><rect x="40.0" y="115" width="205.0" height="205" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="56.0" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">01</text><text x="56.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Naive RAG</text><text x="56.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Chunk, vectorise and</text><text x="56.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">retrieve the top-k by</text><text x="56.0" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">similarity.</text><text x="56.0" y="282.0" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">Retrieves: chunks</text><line x1="247.0" y1="218" x2="261.0" y2="218" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="263.0" y="115" width="205.0" height="205" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="279.0" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">02</text><text x="279.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">RAG + rerank</text><text x="279.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">A second model reorders</text><text x="279.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">what was retrieved.</text><text x="279.0" y="282.0" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">Retrieves: better-ordered</text><text x="279.0" y="297.6" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">chunks</text><line x1="470.0" y1="218" x2="484.0" y2="218" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="486.0" y="115" width="205.0" height="205" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="502.0" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">03</text><text x="502.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Modular RAG</text><text x="502.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Query rewriting, hybrid</text><text x="502.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">search, routing.</text><text x="502.0" y="282.0" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">Retrieves: chunks from</text><text x="502.0" y="297.6" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">several sources</text><line x1="693.0" y1="218" x2="707.0" y2="218" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="709.0" y="115" width="205.0" height="205" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="725.0" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">04</text><text x="725.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Agentic RAG</text><text x="725.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">The agent plans,</text><text x="725.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">searches in a loop and</text><text x="725.0" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">self-corrects.</text><text x="725.0" y="282.0" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">Retrieves: what the agent</text><text x="725.0" y="297.6" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">chooses to read</text><line x1="916.0" y1="218" x2="930.0" y2="218" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="932.0" y="115" width="205.0" height="205" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="948.0" y="143.0" font-size="12" fill="#7AA2C7" font-weight="bold" text-anchor="start">05</text><text x="948.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">GraphRAG</text><text x="948.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">LLM-extracted entity</text><text x="948.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">graph and communities;</text><text x="948.0" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">free schema.</text><text x="948.0" y="282.0" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">Retrieves: neighbours and</text><text x="948.0" y="297.6" font-size="12" fill="#8CC28C" font-weight="bold" text-anchor="start">summaries</text><line x1="1139.0" y1="218" x2="1153.0" y2="218" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="1155.0" y="115" width="205.0" height="205" rx="12" fill="#222B38" stroke="#D97757" stroke-width="2"/><text x="1171.0" y="143.0" font-size="12" fill="#D97757" font-weight="bold" text-anchor="start">06</text><text x="1171.0" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">OAG</text><text x="1171.0" y="191.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">An ontology defined up</text><text x="1171.0" y="208.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">front guides extraction,</text><text x="1171.0" y="225.6" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">validation and</text><text x="1171.0" y="242.5" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">retrieval.</text><text x="1171.0" y="282.0" font-size="12" fill="#D97757" font-weight="bold" text-anchor="start">Retrieves: typed facts with</text><text x="1171.0" y="297.6" font-size="12" fill="#D97757" font-weight="bold" text-anchor="start">sources</text><line x1="40" y1="355" x2="1360" y2="355" stroke="#D97757" stroke-width="2" marker-end="url(#arrc)"/><text x="40" y="383.0" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">Less structure: cheap to set up, the LLM interprets</text><text x="1360" y="383.0" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="end">More structure: the domain decides what a fact is</text><text x="40" y="428.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">Gao et al. 2023 (arXiv 2312.10997), Singh et al. 2025 (arXiv 2501.09136), Edge et al. 2024 (arXiv 2404.16130), Sharma et al. 2024 (arXiv 2412.15235).</text></svg>