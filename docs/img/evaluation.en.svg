<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="600" fill="#0F141A"/><rect x="0" y="0" width="8" height="600" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">DEMO</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">How we evaluate: real questions with known answers</text><rect x="40" y="130" width="300" height="140" rx="12" fill="#222B38" stroke="#D97757" stroke-width="2"/><text x="60" y="165.0" font-size="16" fill="#E8EAED" font-weight="bold" text-anchor="start">Question</text><text x="60" y="192.0" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">A: a real, already solved bug, asked</text><text x="60" y="208.9" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">as if it were new. B: an area to</text><text x="60" y="225.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">explore.</text><rect x="40" y="320" width="300" height="170" rx="12" fill="#1A212B" stroke="#D9B25F" stroke-width="2"/><text x="60" y="355.0" font-size="16" fill="#D9B25F" font-weight="bold" text-anchor="start">Answer key</text><text x="60" y="382.0" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">A: the bug&#x27;s writeup lists what must</text><text x="60" y="398.9" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">not break and is excluded from every</text><text x="60" y="415.8" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">technique (hold-out). B: an objective</text><text x="60" y="432.7" font-size="13" fill="#9AA4B2" font-weight="normal" text-anchor="start">rule on titles.</text><rect x="430" y="120" width="420" height="76" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="450" y="150.0" font-size="15" fill="#E8EAED" font-weight="bold" text-anchor="start">Naive RAG</text><text x="450" y="174.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">chunks by similarity</text><line x1="342" y1="200" x2="428" y2="158" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><line x1="852" y1="158" x2="948" y2="300" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="212" width="420" height="76" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="450" y="242.0" font-size="15" fill="#E8EAED" font-weight="bold" text-anchor="start">Agentic RAG</text><text x="450" y="266.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">Claude searches and reads in a loop</text><line x1="342" y1="200" x2="428" y2="250" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><line x1="852" y1="250" x2="948" y2="300" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="304" width="420" height="76" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="450" y="334.0" font-size="15" fill="#E8EAED" font-weight="bold" text-anchor="start">GraphRAG (/kg)</text><text x="450" y="358.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">neighbours + reading list</text><line x1="342" y1="200" x2="428" y2="342" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><line x1="852" y1="342" x2="948" y2="300" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="430" y="396" width="420" height="76" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="450" y="426.0" font-size="15" fill="#E8EAED" font-weight="bold" text-anchor="start">OAG</text><text x="450" y="450.0" font-size="12" fill="#9AA4B2" font-weight="normal" text-anchor="start">validated typed facts</text><line x1="342" y1="200" x2="428" y2="434" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><line x1="852" y1="434" x2="948" y2="300" stroke="#9AA4B2" stroke-width="2" marker-end="url(#arr)"/><rect x="950" y="200" width="410" height="200" rx="12" fill="#222B38" stroke="#8CC28C" stroke-width="2"/><text x="972" y="235.0" font-size="16" fill="#8CC28C" font-weight="bold" text-anchor="start">Metrics</text><text x="972" y="265.0" font-size="13" fill="#E8EAED" font-weight="normal" text-anchor="start">Recall: expected found / expected</text><text x="972" y="287.9" font-size="13" fill="#E8EAED" font-weight="normal" text-anchor="start">Precision: expected found / returned</text><text x="972" y="310.8" font-size="13" fill="#E8EAED" font-weight="normal" text-anchor="start">Cost: context tokens and LLM calls</text><text x="972" y="333.7" font-size="13" fill="#E8EAED" font-weight="normal" text-anchor="start">Claude&#x27;s final answer, recorded</text><line x1="342" y1="405" x2="948" y2="360" stroke="#D9B25F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="40" y="545.0" font-size="13" fill="#D9B25F" font-weight="normal" text-anchor="start">Two questions are not an evaluation: the expected list is a floor. The real evaluation is Step 0 (15-20 questions, rules and exploration).</text><text x="40" y="578.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">demo/compare.py and demo/record_answer.py.</text></svg>