<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker></defs><rect width="1400" height="720" fill="#0F141A"/><rect x="0" y="0" width="8" height="720" fill="#D97757"/><text x="40" y="44.0" font-size="13" fill="#D97757" font-weight="bold" text-anchor="start">GUÍA DE USO</text><text x="40" y="80.0" font-size="26" fill="#E8EAED" font-weight="bold" text-anchor="start">Cuándo conviene cada técnica</text><rect x="40" y="120" width="210" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="147.0" font-size="14" fill="#9AA4B2" font-weight="bold" text-anchor="start">Técnica</text><rect x="270" y="120" width="310" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="147.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Conviene cuando</text><rect x="600" y="120" width="310" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="147.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Coste y riesgo</text><rect x="930" y="120" width="420" height="42" rx="12" fill="#222B38" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="147.0" font-size="14" fill="#D97757" font-weight="bold" text-anchor="start">Ejemplo en nuestro trabajo</text><rect x="40" y="172" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="198.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">Sin RAG</text><rect x="270" y="172" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="198.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Todo el contexto cabe en la ventana del</text><text x="284" y="214.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">modelo.</text><rect x="600" y="172" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="198.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Ninguno extra; coste por tokens.</text><rect x="930" y="172" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="198.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Un ticket y su writeup en una sesión.</text><rect x="40" y="254" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="280.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">Naive RAG</text><rect x="270" y="254" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="280.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Preguntas puntuales sobre mucho texto sin</text><text x="284" y="296.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">estructura.</text><rect x="600" y="254" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="280.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Barato; recupera trozos sueltos y ruido.</text><rect x="930" y="254" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="280.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Buscar dónde se menciona un error concreto.</text><rect x="40" y="336" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="362.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">RAG + rerank / híbrido</text><rect x="270" y="336" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="362.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Vocabulario variado o nombres exactos</text><text x="284" y="378.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">(IDs, símbolos).</text><rect x="600" y="336" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="362.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Un modelo más; mejor precisión.</text><rect x="930" y="336" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="362.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">IDs de ticket y nombres de función.</text><rect x="40" y="418" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="444.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">Agentic RAG</text><rect x="270" y="418" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="444.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Preguntas exploratorias o de varios pasos.</text><rect x="600" y="418" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="444.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Más tokens y pasos; varía entre</text><text x="614" y="460.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">ejecuciones.</text><rect x="930" y="418" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="444.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Investigar la causa raíz de un bug nuevo.</text><rect x="40" y="500" width="210" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="54" y="526.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">GraphRAG</text><rect x="270" y="500" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="526.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Relaciones y temas globales; «qué hay</text><text x="284" y="542.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">alrededor de X».</text><rect x="600" y="500" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="526.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Construcción cara; esquema inestable.</text><rect x="930" y="500" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="526.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">/kg: zona de peligro antes de tocar código.</text><rect x="40" y="582" width="210" height="72" rx="12" fill="#222B38" stroke="#D97757" stroke-width="1.2"/><text x="54" y="608.0" font-size="14" fill="#7AA2C7" font-weight="bold" text-anchor="start">OAG</text><rect x="270" y="582" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="284" y="608.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Hechos tipados, reglas, auditoría y</text><text x="284" y="624.2" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">atribución.</text><rect x="600" y="582" width="310" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="614" y="608.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Escribir y mantener la ontología.</text><rect x="930" y="582" width="420" height="72" rx="12" fill="#1A212B" stroke="#2E3948" stroke-width="1.2"/><text x="944" y="608.0" font-size="12.5" fill="#E8EAED" font-weight="normal" text-anchor="start">Invariantes a respetar antes del merge.</text><text x="40" y="698.0" font-size="12" fill="#66707E" font-weight="normal" text-anchor="start">Regla práctica: empezar por lo más simple que responda las preguntas reales, y medir antes de subir de nivel.</text></svg>